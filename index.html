<!doctype html>
<html lang="en" data-theme="myspace">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dear DJ</title>
<script>
  // Apply the saved look before the page paints, so there's no flash of the wrong theme.
  (function () {
    var t = 'myspace';
    try { var s = localStorage.getItem('dear-dj-theme'); if (s === 'clean' || s === 'myspace') t = s; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<!-- Your settings live in config.js (edit that file, not this one) -->
<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>

<style>
  /* =====================================================================
     SHARED STRUCTURE (no colors or personality here; see the two skins below)
     ===================================================================== */
  :root { --r-card: 10px; --r-ui: 8px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; color: var(--text); background: var(--page-bg); font: 400 var(--fs)/1.6 var(--body); }
  h1, h2, h3, h4 { font-family: var(--head); margin: 0; line-height: 1.1; }
  p { margin: 0; }
  a { color: var(--link); }
  .muted { color: var(--soft); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header.top { max-width: 980px; margin: 0 auto; padding: 18px 20px 0; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--head); font-weight: 800; font-size: 1.5rem; }
  .brand svg { width: 38px; height: 24px; color: var(--accent); }
  nav { display: flex; flex-wrap: wrap; align-items: center; }
  nav a:not(.btn) { text-decoration: none; font-weight: 600; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  footer { max-width: 980px; margin: 0 auto; padding: 0 20px 40px; color: var(--soft); font-size: .8rem; text-align: center; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spread { justify-content: space-between; }

  .btn { font: 700 .875rem var(--body); padding: 8px 16px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  .btn.small { padding: 4px 12px; font-size: .8rem; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: 600 .8rem var(--body); padding: 5px 14px; cursor: pointer; }
  .pill { display: inline-block; font-size: .75rem; line-height: 1.7; padding: 0 9px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .hero { display: grid; gap: 16px; margin-bottom: 30px; max-width: 640px; }
  .hero p { color: var(--soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 20px; margin-top: 22px; }
  .jcard { display: flex; flex-direction: column; overflow: hidden; color: var(--text); text-decoration: none; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .jcard.dim { opacity: .6; }
  .jcard .top { padding: 14px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .jcard .top svg { flex: none; width: 46px; height: 28px; margin-top: 2px; }
  .jcard .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .hand { align-self: flex-start; justify-self: start; overflow-wrap: anywhere; }
  .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; color: var(--soft); font-size: .8rem; }
  .empty { padding: 48px 0; display: grid; gap: 12px; justify-items: start; }

  .sleeve { overflow: hidden; }
  .sleeve .head { padding: 22px; display: grid; gap: 8px; }
  .sleeve .inner { padding: 22px; display: grid; gap: 24px; }
  .lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px; }
  ol.tracks { margin: 0; padding: 0; list-style: none; counter-reset: t; }
  ol.tracks li { counter-increment: t; padding: 7px 0 7px 32px; position: relative; border-bottom: 1px solid var(--line); }
  ol.tracks li::before { content: counter(t); position: absolute; left: 0; color: var(--soft); font-variant-numeric: tabular-nums; }
  .pl { padding: 16px; display: grid; gap: 12px; }
  .pl iframe { border: 0; border-radius: 12px; width: 100%; height: 352px; }
  .comments { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 12px; }
  .comment { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .comment .cbody { white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment .row { gap: 8px; }
  .comment-form { display: grid; gap: 8px; }
  .comment-form textarea { min-height: 3.2rem; }
  .note-quote { border-left: 3px solid var(--band, var(--accent)); padding-left: 12px; }
  .banner { padding: 12px 14px; }

  form.card { padding: 22px; display: grid; gap: 20px; max-width: 640px; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
  legend { padding: 0; margin-bottom: 4px; }
  label { font-weight: 700; }
  .hint { color: var(--soft); font-size: .85rem; font-weight: 400; }
  input[type=text], input[type=email], input[type=password], input[type=url], textarea, select { width: 100%; font: 400 .9rem var(--body); color: var(--text); padding: 9px 11px; }
  textarea { resize: vertical; }
  .checks { display: grid; gap: 8px; }
  .checks label { font-weight: 400; display: flex; gap: 10px; align-items: center; }
  .checks input { width: 20px; height: 20px; accent-color: var(--accent); }
  .field-search { position: relative; }
  .suggest { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; }
  .suggest button { width: 100%; text-align: left; font: 400 .9rem var(--body); background: none; border: 0; padding: 8px 10px; cursor: pointer; color: var(--text); }
  .case { padding: 16px; display: grid; gap: 10px; }
  .case ul { margin: 0; padding-left: 18px; }

  dialog.dlg { padding: 22px; max-width: 420px; width: calc(100% - 32px); color: var(--text); }
  dialog.dlg > * + * { margin-top: 14px; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 12px 18px; max-width: min(92vw, 520px); transition: opacity .2s, transform .2s; z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .ticker { overflow: hidden; white-space: nowrap; }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 36s linear infinite; }
  .ticker:hover span { animation-play-state: paused; }
  @keyframes tick { to { transform: translateX(-100%); } }

  /* =====================================================================
     SKIN 1: MYSPACE (the fun one): black page, glitter, blue header bars
     ===================================================================== */
  html[data-theme="myspace"] {
    color-scheme: dark;
    --page-bg: #000;
    --text: #F4F4FF; --soft: #A9B4D6; --line: #27406E; --panel: #0A0A18;
    --link: #7EC8FF; --accent: #FF3FA4; --accent-ink: #1A0010; --danger: #FF8A8A; --focus: #FF3FA4;
    --ms-blue: #2F6AA3; --ms-edge: #1B3A66; --ms-light: #B1D0F0; --orange: #FF9933;
    --body: Verdana, Geneva, Tahoma, sans-serif; --head: Arial, Helvetica, sans-serif; --fs: .875rem;
    --r-card: 3px; --r-ui: 3px;
  }
  html[data-theme="myspace"] body {
    background:
      radial-gradient(1.5px 1.5px at 12px 18px, #FF3FA4 50%, transparent 53%),
      radial-gradient(1px 1px at 70px 40px, #fff 50%, transparent 53%),
      radial-gradient(1.5px 1.5px at 100px 95px, #6EC6FF 50%, transparent 53%),
      radial-gradient(1px 1px at 38px 84px, #fff 50%, transparent 53%),
      #000;
    background-size: 120px 120px;
  }
  html[data-theme="myspace"] h1 {
    font: 900 clamp(2.8rem, 9vw, 5rem)/1.05 var(--head); letter-spacing: -.03em; padding: 0 .1em .08em 0;
    background: linear-gradient(90deg, #FF3FA4 0%, #FFD1EB 18%, #FF3FA4 36%, #6EC6FF 60%, #D9F0FF 78%, #FF3FA4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #1B3A66);
  }
  html[data-theme="myspace"] h2 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900; color: var(--accent); text-shadow: 2px 2px 0 var(--ms-edge); }
  html[data-theme="myspace"] h3 { font-size: 1.1rem; font-weight: 900; }
  html[data-theme="myspace"] a:hover { color: #fff; }
  html[data-theme="myspace"] legend { font-weight: 900; font-size: 1rem; color: var(--accent); }

  html[data-theme="myspace"] header.top { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }
  html[data-theme="myspace"] .brand { color: #fff; font-weight: 900; text-shadow: 2px 2px 0 var(--ms-edge); }
  html[data-theme="myspace"] nav { background: linear-gradient(#3670AA, #2F6AA3); border: 1px solid var(--ms-edge); border-radius: 3px; }
  html[data-theme="myspace"] nav a:not(.btn) { color: #fff; padding: 7px 14px; font-size: .8rem; border-right: 1px solid var(--ms-edge); }
  html[data-theme="myspace"] nav a:not(.btn):hover { background: var(--ms-edge); }
  html[data-theme="myspace"] nav a:not(.btn)[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
  html[data-theme="myspace"] nav .btn { margin: 4px 0 4px 6px; }
  html[data-theme="myspace"] nav .btn:last-child { margin-right: 6px; }

  html[data-theme="myspace"] .jcard, html[data-theme="myspace"] .sleeve, html[data-theme="myspace"] .pl,
  html[data-theme="myspace"] .case, html[data-theme="myspace"] form.card, html[data-theme="myspace"] .banner,
  html[data-theme="myspace"] dialog.dlg { background: var(--panel); border: 2px solid var(--ms-blue); border-radius: var(--r-card); }
  html[data-theme="myspace"] .jcard, html[data-theme="myspace"] .sleeve { border-color: var(--band, var(--ms-blue)); }
  html[data-theme="myspace"] .jcard:hover { transform: translateY(-2px); box-shadow: 0 0 14px var(--band, var(--accent)); }
  html[data-theme="myspace"] .jcard .top, html[data-theme="myspace"] .sleeve .head { background: var(--band, var(--ms-light)); color: #0B1020; border-bottom: 2px solid #000; }
  html[data-theme="myspace"] .jcard .top h3, html[data-theme="myspace"] .sleeve .head h2 { color: #0B1020; text-shadow: none; }
  html[data-theme="myspace"] dialog.dlg { border-color: var(--accent); }
  html[data-theme="myspace"] dialog.dlg::backdrop { background: rgba(0, 0, 0, .8); }

  html[data-theme="myspace"] .hand { font-weight: 700; font-size: .95rem; }
  html[data-theme="myspace"] .jcard .hand { color: var(--text); }
  html[data-theme="myspace"] .sleeve .head .hand { color: #0B1020; }
  html[data-theme="myspace"] .pill { background: #0F2440; color: #CFE8FF; border: 1px solid var(--ms-blue); border-radius: 2px; }
  html[data-theme="myspace"] .sleeve .head .pill, html[data-theme="myspace"] .jcard .top .pill { background: #fff; color: #0B1020; border-color: #0B1020; }
  html[data-theme="myspace"] .pill.solid { background: var(--orange); color: #201000; border-color: #A35A00; }

  html[data-theme="myspace"] .btn { background: linear-gradient(#F4FAFF, var(--ms-light)); border: 1px solid var(--ms-blue); color: #10253D; border-radius: 3px; }
  html[data-theme="myspace"] .btn:hover { background: linear-gradient(#fff, #D4E6FA); color: #10253D; }
  html[data-theme="myspace"] .btn.primary { background: linear-gradient(#FF8AC6, #FF3FA4); border-color: #A3005F; color: var(--accent-ink); }
  html[data-theme="myspace"] .btn.primary:hover { background: linear-gradient(#FFA3D2, #FF5BB2); color: var(--accent-ink); }
  html[data-theme="myspace"] .btn.danger { background: linear-gradient(#FFD0D0, #F26B6B); border-color: #7A1010; color: #2B0606; }
  html[data-theme="myspace"] .chip { background: #0F2440; border: 1px solid var(--ms-blue); color: #CFE8FF; border-radius: 3px; }
  html[data-theme="myspace"] .chip:hover { background: var(--ms-edge); }
  html[data-theme="myspace"] .chip.on { background: var(--accent); border-color: #A3005F; color: var(--accent-ink); }

  html[data-theme="myspace"] .lcd { background: #05101F; border: 2px solid var(--ms-blue); border-radius: 3px; padding: 10px 14px; display: grid; gap: 8px; }
  html[data-theme="myspace"] .lcd .nums { display: flex; flex-wrap: wrap; gap: 2px 24px; font-weight: 700; }
  html[data-theme="myspace"] .lcd b { color: var(--accent); }
  html[data-theme="myspace"] .ticker { border-top: 1px dashed var(--ms-blue); padding-top: 8px; color: #FFD1EB; }

  /* Blue header bars, like profile boxes */
  html[data-theme="myspace"] .lists h3, html[data-theme="myspace"] .cm-head { background: var(--ms-blue); color: #fff; padding: 5px 10px; font-size: .9rem; font-weight: 900; margin: 0; }
  html[data-theme="myspace"] ol.tracks { border: 1px solid var(--ms-blue); border-top: 0; padding: 4px 10px; }
  html[data-theme="myspace"] ol.tracks li { padding-left: 28px; }
  html[data-theme="myspace"] ol.tracks li:last-child { border-bottom: 0; }
  html[data-theme="myspace"] ol.tracks li::before { color: var(--accent); font-weight: 900; }
  html[data-theme="myspace"] ol.tracks a { color: var(--text); text-decoration-color: var(--ms-blue); }
  html[data-theme="myspace"] ol.tracks a:hover { color: var(--link); }
  html[data-theme="myspace"] .comments { border: 1px solid var(--ms-blue); padding: 0; gap: 10px; }
  html[data-theme="myspace"] .comments > :not(.cm-head) { margin-left: 12px; margin-right: 12px; }
  html[data-theme="myspace"] .comments > :last-child { margin-bottom: 12px; }
  html[data-theme="myspace"] .comment { border-bottom: 1px dotted var(--ms-blue); }
  html[data-theme="myspace"] .comment strong { color: var(--accent); }

  html[data-theme="myspace"] input[type=text], html[data-theme="myspace"] input[type=email], html[data-theme="myspace"] input[type=password],
  html[data-theme="myspace"] input[type=url], html[data-theme="myspace"] textarea, html[data-theme="myspace"] select { background: #000; border: 1px solid var(--ms-blue); border-radius: 2px; }
  html[data-theme="myspace"] ::placeholder { color: #7F8CB8; opacity: 1; }
  html[data-theme="myspace"] .suggest { background: var(--panel); border: 1px solid var(--accent); }
  html[data-theme="myspace"] .suggest button:hover, html[data-theme="myspace"] .suggest button:focus-visible { background: var(--ms-edge); }
  html[data-theme="myspace"] #toast { background: #000; color: #fff; border: 2px solid var(--accent); border-radius: 3px; }
  html[data-theme="myspace"] #toast.err { border-color: var(--danger); color: #FFD6D6; }

  /* =====================================================================
     SKIN 2: CLEAN (the quieter one): white paper, serif headings, thin lines
     ===================================================================== */
  html[data-theme="clean"] {
    color-scheme: light;
    --page-bg: #F6F7F9;
    --text: #15171C; --soft: #5A606B; --line: #DADDE3; --panel: #FFFFFF;
    --link: #2F2BD8; --accent: #3B36E8; --accent-ink: #FFFFFF; --danger: #B3261E; --focus: #3B36E8; --field: #8F96A3;
    --body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --head: Georgia, 'Times New Roman', serif; --fs: .9375rem;
  }
  html[data-theme="clean"] h1 { font-size: clamp(2.6rem, 8vw, 4.2rem); font-weight: 700; letter-spacing: -.02em; }
  html[data-theme="clean"] h2 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; }
  html[data-theme="clean"] h3 { font-size: 1.2rem; font-weight: 700; }
  html[data-theme="clean"] legend { font: 700 1.1rem var(--head); }
  html[data-theme="clean"] header.top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--line); max-width: 940px; }
  html[data-theme="clean"] .brand { color: var(--text); }
  html[data-theme="clean"] nav { gap: 6px 18px; }
  html[data-theme="clean"] nav a:not(.btn) { color: var(--soft); padding: 4px 0; border-bottom: 2px solid transparent; }
  html[data-theme="clean"] nav a:not(.btn):hover { color: var(--text); }
  html[data-theme="clean"] nav a:not(.btn)[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); }

  html[data-theme="clean"] .jcard, html[data-theme="clean"] .sleeve, html[data-theme="clean"] .pl, html[data-theme="clean"] .case,
  html[data-theme="clean"] form.card, html[data-theme="clean"] .banner, html[data-theme="clean"] dialog.dlg,
  html[data-theme="clean"] .suggest { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); }
  html[data-theme="clean"] .jcard:hover { border-color: var(--text); }
  html[data-theme="clean"] .jcard .top { border-top: 6px solid var(--band, var(--line)); padding: 16px 16px 0; }
  html[data-theme="clean"] .jcard .top svg { display: none; }
  html[data-theme="clean"] .sleeve .head { border-top: 8px solid var(--band, var(--line)); padding: 24px 22px 4px; }
  html[data-theme="clean"] dialog.dlg::backdrop { background: rgba(21, 23, 28, .45); }
  html[data-theme="clean"] .hand { font: italic 1.05rem var(--head); color: var(--soft); }
  html[data-theme="clean"] .pill { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 999px; }
  html[data-theme="clean"] .pill.solid { background: var(--text); color: #fff; border-color: var(--text); }

  html[data-theme="clean"] .btn { background: #fff; border: 1px solid var(--text); color: var(--text); border-radius: var(--r-ui); font-weight: 600; }
  html[data-theme="clean"] .btn:hover { background: #ECEEF2; color: var(--text); }
  html[data-theme="clean"] .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  html[data-theme="clean"] .btn.primary:hover { background: #2B26C9; border-color: #2B26C9; color: var(--accent-ink); }
  html[data-theme="clean"] .btn.danger { color: var(--danger); border-color: var(--danger); }
  html[data-theme="clean"] .chip { background: #fff; border: 1px solid var(--line); color: var(--text); border-radius: 999px; }
  html[data-theme="clean"] .chip:hover { border-color: var(--text); }
  html[data-theme="clean"] .chip.on { background: var(--text); border-color: var(--text); color: #fff; }

  html[data-theme="clean"] .lcd { display: block; }
  html[data-theme="clean"] .lcd .nums { display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--soft); font-size: .9rem; }
  html[data-theme="clean"] .lcd b { color: var(--text); }
  html[data-theme="clean"] .cm-head { font: 600 .9rem var(--body); color: var(--soft); }
  html[data-theme="clean"] .lists h3 { margin-bottom: 6px; }

  html[data-theme="clean"] input[type=text], html[data-theme="clean"] input[type=email], html[data-theme="clean"] input[type=password],
  html[data-theme="clean"] input[type=url], html[data-theme="clean"] textarea, html[data-theme="clean"] select { background: #fff; border: 1px solid var(--field); border-radius: var(--r-ui); }
  html[data-theme="clean"] ::placeholder { color: #6E7480; opacity: 1; }
  html[data-theme="clean"] .suggest { box-shadow: 0 8px 22px rgba(21, 23, 28, .12); }
  html[data-theme="clean"] .suggest button:hover, html[data-theme="clean"] .suggest button:focus-visible { background: #ECEEF2; }
  html[data-theme="clean"] ol.tracks a { color: var(--text); text-decoration-color: var(--field); }
  html[data-theme="clean"] ol.tracks a:hover { color: var(--accent); }
  html[data-theme="clean"] #toast { background: var(--text); color: #fff; border-radius: var(--r-ui); }
  html[data-theme="clean"] #toast.err { background: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    .ticker { white-space: normal; }
    .ticker span { animation: none; padding-left: 0; }
    .jcard, #toast { transition: none; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Dear DJ, home">
    <svg viewBox="0 0 38 24" aria-hidden="true"><rect x="1" y="1" width="36" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><g><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v3M12 14v3M7 12h3M14 12h3" stroke="currentColor" stroke-width="1.5"/></g><g><circle cx="26" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M26 7v3M26 14v3M21 12h3M28 12h3" stroke="currentColor" stroke-width="1.5"/></g></svg>
    Dear DJ,
  </a>
  <nav id="nav" aria-label="Main"></nav>
</header>
<main id="app"></main>
<footer>Made for friends and family. Best viewed with headphones on.</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Setup
   ===================================================================== */
const CFG = window.CONFIG || {};
const configured = Boolean(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
const sb = configured ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

let user = null;       // auth user
let me = null;         // { id, display_name }
let isAdmin = false;
let afterLogin = null; // where to go once signed in

const WANT = { new_artists: 'New artists', new_songs: 'New songs', mood: 'A mood' };
const BANDS = ['#FF7A5C', '#FFC83D', '#4FD1B5', '#7FA2FF', '#F58BC8', '#B79CFF'];
const SPOTIFY_ID = /^[A-Za-z0-9]{22}$/;

/* Two looks: "myspace" (fun, default) and "clean". The choice is remembered in this browser. */
let theme = document.documentElement.getAttribute('data-theme') === 'clean' ? 'clean' : 'myspace';
const pad3 = n => String(n == null ? 0 : n).padStart(3, '0');
const COPY = {
  myspace: {
    mood: m => 'Mood: ☺ ' + m,
    songs: 'Top songs',
    artists: 'Top artists',
    stats: (r, p) => [

/* =====================================================================
   Small helpers. h() builds DOM nodes and only ever sets text, never
   raw HTML, so anything a user types is displayed as plain text.
   ===================================================================== */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.setAttribute('style', v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function mount(...nodes) {
  app.replaceChildren(...nodes.flat(Infinity).filter(Boolean));
  window.scrollTo(0, 0);
}

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.className = ''; }, 4500);
}

function friendly(e) {
  if (!e) return 'Something went wrong.';
  if (e.code === '42501') return 'You can’t post right now. If that seems wrong, ask whoever runs this site.';
  return e.message || 'Something went wrong.';
}

function band(id) {
  let n = 0;
  for (const c of String(id)) n = (n * 31 + c.charCodeAt(0)) >>> 0;
  return BANDS[n % BANDS.length];
}
const fmtDate = d => new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const count = r => (r.playlists && r.playlists[0] && r.playlists[0].count) || 0;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

}

function parsePlaylistId(url) {
  const m = String(url).trim().match(/^https:\/\/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?playlist\/([A-Za-z0-9]{22})(?:[/?#].*)?$/);
  return m ? m[1] : null;
}

function searchField(kind, placeholder) {
  const input = h('input', { type: 'text', maxLength: 100, placeholder, autocomplete: 'off', 'aria-label': placeholder });
  const list = h('ul', { class: 'suggest', hidden: true });
  const wrap = h('div', { class: 'field-search' }, input, list);
  let picked = null, timer = null, seq = 0;
  const label = p => p.artist ? `${p.name} — ${p.artist}` : p.name;

  function show(items) {
    list.replaceChildren(...items.slice(0, 5).map(it => h('li', {},
      h('button', { type: 'button', onclick: () => {
        picked = { kind, id: it.id, name: it.name, artist: it.artist || null };
        input.value = label(picked);
        list.hidden = true;
      } }, it.name, it.artist ? h('span', { class: 'muted' }, ' — ' + it.artist) : null))));
    list.hidden = !items.length;
  }

  input.addEventListener('input', () => {
    picked = null;
    clearTimeout(timer);
    const q = input.value.trim();
    if (!CFG.SEARCH_URL || q.length < 2) { list.hidden = true; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const r = await fetch(`${CFG.SEARCH_URL}?type=${kind}&q=${encodeURIComponent(q)}`);
        const items = await r.json();
        if (mine === seq && Array.isArray(items)) show(items);
      } catch { list.hidden = true; }
    }, 250);
  });
  input.addEventListener('blur', () => setTimeout(() => { list.hidden = true; }, 200));

  wrap.getValue = () => {
    const t = input.value.trim();
    if (!t) return null;
    return picked && label(picked) === t ? picked : { kind, name: t };
  };
  return wrap;
}

  if (!user) return requireLogin();

      class: 'card',
      onsubmit: async e => {
        e.preventDefault();
        const s = songs.map(f => f.getValue()).filter(Boolean);
        const a = artists.map(f => f.getValue()).filter(Boolean);
        const w = wants.filter(x => x.box.checked).map(x => x.k);
        if (!s.length || !a.length) return toast('Add at least one song and one artist.', true);
        if (!w.length) return toast('Pick at least one thing you’re looking for.', true);
        if (w.includes('mood') && !mood.value.trim()) return toast('You picked “A mood”. Describe it in a few words.', true);
        btn.disabled = true;
        const { data, error } = await sb.from('requests').insert({
          user_id: user.id, title: title.value.trim(), top_songs: s, top_artists: a,
          wants: w, mood: mood.value.trim() || null, notes: notes.value.trim() || null
        }).select('id').single();
        btn.disabled = false;
        if (error) return toast(friendly(error), true);
        toast('Request posted.');
        location.hash = '#/request/' + data.id;
      }
    },
      h('div', {}, h('label', { for: 'rq-title' }, 'Give it a title'), title),
      h('fieldset', {}, h('legend', {}, 'Your top songs'), h('p', { class: 'hint' }, 'Up to five. One is enough to start.'), songs),
      h('fieldset', {}, h('legend', {}, 'Your top artists'), h('p', { class: 'hint' }, 'Up to five.'), artists),
      h('fieldset', {}, h('legend', {}, 'What are you looking for?'),
        h('div', { class: 'checks' }, wants.map(x => h('label', {}, x.box, x.l)))),
      h('div', {}, h('label', { for: 'rq-mood' }, 'The mood'), h('p', { class: 'hint' }, 'Only if you picked “A mood”.'), mood),
      h('div', {}, h('label', { for: 'rq-notes' }, 'Anything else? (optional)'), notes),
      h('div', {}, btn))));
}

/* ---------- My stuff ---------- */
async function viewMine() {
  if (!user) return requireLogin();
  loading();
  const [a, b] = await Promise.all([
    sb.from('requests').select('id,title,status,created_at,playlists(count)').eq('user_id', user.id).order('created_at', { ascending: false }),
    sb.from('playlists').select('id,request_id,status,created_at,requests(title)').eq('user_id', user.id).order('created_at', { ascending: false })
  ]);
  if (a.error) return mount(errorBox(a.error));
  const li = (href, text, meta) => h('li', {}, h('a', { href }, text), h('span', { class: 'muted' }, ' · ' + meta));
  mount(h('div', { class: 'stack' },
    h('h2', {}, 'My requests'),
    (a.data || []).length
      ? h('ul', {}, a.data.map(r => li('#/request/' + r.id, r.title, `${plural(count(r), 'playlist', 'playlists')}${r.status !== 'open' ? ', ' + r.status : ''}`)))
      : h('p', { class: 'muted' }, 'You haven’t written any yet.'),
    h('h2', {}, 'Playlists I’ve sent'),
    (b.data || []).length
      ? h('ul', {}, b.data.map(p => li('#/request/' + p.request_id, (p.requests && p.requests.title) || 'A request', fmtDate(p.created_at) + (p.status === 'hidden' ? ', hidden' : ''))))
      : h('p', { class: 'muted' }, 'None yet. Pick a request on the board.')));
}

/* ---------- Login / sign up ---------- */
function viewLogin() {
  if (user) { location.hash = afterLogin || '#/'; return; }
  let signup = false;
  const box = h('div', { class: 'stack' });

  function draw() {
    const email = h('input', { type: 'email', id: 'au-email', required: true, autocomplete: 'email' });
    const pass = h('input', { type: 'password', id: 'au-pass', required: true, minLength: 8, autocomplete: signup ? 'new-password' : 'current-password' });
    const name = h('input', { type: 'text', id: 'au-name', required: true, maxLength: 40, autocomplete: 'nickname' });
    const btn = h('button', { class: 'btn primary', type: 'submit' }, signup ? 'Create account' : 'Sign in');
    box.replaceChildren(
      h('h2', {}, signup ? 'Create an account' : 'Sign in'),
      h('form', {
        class: 'card',
        onsubmit: async e => {
          e.preventDefault();
          if (signup && name.value.includes('@')) return toast('Your name is shown publicly, so it can’t contain “@”. Please don’t use your email address.', true);
          btn.disabled = true;
          const res = signup
            ? await sb.auth.signUp({ email: email.value.trim(), password: pass.value, options: { data: { display_name: name.value.trim() } } })
            : await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
          btn.disabled = false;
          if (res.error) return toast(res.error.message, true);
          if (signup && !res.data.session) toast('Check your email to confirm your account, then sign in.');
        }
      },
        signup ? h('div', {}, h('label', { for: 'au-name' }, 'Name shown to others'), h('p', { class: 'hint' }, 'Everyone can see this. Your email is never shown.'), name) : null,
        h('div', {}, h('label', { for: 'au-email' }, 'Email'), email),
        h('div', {}, h('label', { for: 'au-pass' }, 'Password'), signup ? h('p', { class: 'hint' }, 'At least 8 characters.') : null, pass),
        h('div', {}, btn)),
      h('p', {}, signup ? 'Already have an account? ' : 'New here? ',
        h('a', { href: '#/login', onclick: e => { e.preventDefault(); signup = !signup; draw(); } }, signup ? 'Sign in' : 'Create an account')));
  }
  draw();
  mount(box);
}

/* ---------- Admin ---------- */
async function viewAdmin() {
  if (!isAdmin) return mount(h('p', {}, 'Admins only.'));
  loading();
  const { data: reports, error } = await sb.from('reports')
    .select('id,target_type,target_id,reason,created_at,profiles(display_name)')
    .eq('resolved', false).order('created_at');
  if (error) return mount(errorBox(error));

  const groups = new Map();
  for (const r of reports) {
    const k = r.target_type + ':' + r.target_id;
    if (!groups.has(k)) groups.set(k, { type: r.target_type, id: r.target_id, first: r.id, items: [] });
    groups.get(k).items.push(r);
  }
  const all = [...groups.values()];
  const reqIds = all.filter(g => g.type === 'request').map(g => g.id);
  const plIds = all.filter(g => g.type === 'playlist').map(g => g.id);
  const cmIds = all.filter(g => g.type === 'comment').map(g => g.id);
  const [rq, pl, cmt] = await Promise.all([
    reqIds.length ? sb.from('requests').select('id,title,mood,notes,status,profiles(display_name)').in('id', reqIds) : { data: [] },
    plIds.length ? sb.from('playlists').select('id,spotify_id,note,status,request_id,profiles(display_name)').in('id', plIds) : { data: [] },
    cmIds.length ? sb.from('comments').select('id,body,status,playlists(request_id),profiles(display_name)').in('id', cmIds) : { data: [] }
  ]);
  const target = new Map([...(rq.data || []), ...(pl.data || []), ...(cmt.data || [])].map(x => [x.id, x]));

  async function act(reportId, action) {
    const { error: e } = await sb.rpc('admin_moderate', { p_report_id: reportId, p_action: action });
    if (e) return toast(friendly(e), true);
    toast('Done.');
    viewAdmin();
  }

  const cases = all.map(g => {
    const t = target.get(g.id);
    const author = t && t.profiles ? t.profiles.display_name : 'unknown';
    return h('article', { class: 'case' },
      h('div', { class: 'row spread' },
        h('strong', {}, g.type === 'request' ? (t ? t.title : 'A deleted request') : (g.type === 'comment' ? 'Comment by ' : 'Playlist by ') + author),
        h('span', { class: 'pill' }, t ? t.status : 'gone')),
      t && g.type === 'request' ? h('p', {}, `By ${author}. ${t.mood || ''} ${t.notes || ''}`) : null,
      t && g.type === 'playlist' ? h('p', {}, h('a', { href: 'https://open.spotify.com/playlist/' + t.spotify_id, target: '_blank', rel: 'noopener' }, 'Open the playlist'), t.note ? ' · ' + t.note : '', ' · ', h('a', { href: '#/request/' + t.request_id }, 'See the request')) : null,
      t && g.type === 'request' ? h('p', {}, h('a', { href: '#/request/' + g.id }, 'Open the request')) : null,
      t && g.type === 'comment' ? h('p', {}, '“' + t.body + '”', t.playlists ? [' · ', h('a', { href: '#/request/' + t.playlists.request_id }, 'See the request')] : null) : null,
      h('ul', {}, g.items.map(r => h('li', {}, `${(r.profiles && r.profiles.display_name) || 'someone'}: ${r.reason.replace(/_/g, ' ')}`))),
      h('div', { class: 'row' },
        h('button', { class: 'btn small', type: 'button', onclick: () => act(g.first, 'dismiss') }, 'Dismiss (looks fine)'),
        h('button', { class: 'btn small danger', type: 'button', onclick: () => act(g.first, 'hide') }, 'Hide'),
        h('button', { class: 'btn small danger', type: 'button', onclick: () => { if (confirm(`Hide this and ban ${author}?`)) act(g.first, 'ban'); } }, 'Hide and ban author')));
  });

  mount(h('div', { class: 'stack' },
    h('h2', {}, 'Reports'),
    cases.length ? cases : h('p', { class: 'muted' }, 'Nothing waiting. All quiet.')));
}

/* =====================================================================
   Router
   ===================================================================== */
async function route() {
  renderNav();
  if (!sb) return viewSetup();
  const [, page, arg] = location.hash.split('/');
  switch (page) {
    case 'request': return arg ? viewRequest(arg) : viewBoard();
    case 'new': return viewNew();
    case 'mine': return viewMine();
    case 'login': return viewLogin();
    case 'admin': return viewAdmin();
    default: return viewBoard();
  }
}
window.addEventListener('hashchange', route);

async function init() {
  if (!sb) { renderNav(); return viewSetup(); }
  await refreshUser();
  let lastId = user ? user.id : null;
  sb.auth.onAuthStateChange(event => {
    if (event !== 'SIGNED_IN' && event !== 'SIGNED_OUT') return;
    setTimeout(async () => {
      await refreshUser();
      const id = user ? user.id : null;
      if (id === lastId) return;           // ignore token refreshes and tab refocus
      lastId = id;
      if (user && location.hash.startsWith('#/login')) {
        const dest = afterLogin || '#/'; afterLogin = null; location.hash = dest;
      } else route();
    }, 0);
  });
  route();
}
init();
})();
</script>
</body>
</html>
